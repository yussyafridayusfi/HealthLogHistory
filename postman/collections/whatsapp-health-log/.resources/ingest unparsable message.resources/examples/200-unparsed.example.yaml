$kind: http-example
name: '200 unparsed'
order: 1000
request:
  url: '{{base_url}}/ingest'
  method: POST
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "status": "unparsed",
        "reason": "No recognised fields. Expected lines like 'blood sugar: 100' and 'time check: 08.08 am'.",
        "warnings": []
      }
