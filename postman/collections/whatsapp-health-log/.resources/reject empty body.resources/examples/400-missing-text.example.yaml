$kind: http-example
name: '400 missing text'
order: 1000
request:
  url: '{{base_url}}/ingest'
  method: POST
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "error": "Field \"text\" is required and must be a non-empty string."
      }
