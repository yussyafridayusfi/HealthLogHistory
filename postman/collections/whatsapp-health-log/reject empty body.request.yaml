$kind: http-request
name: Reject empty body
method: POST
url: '{{base_url}}/ingest'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {}
examples: './.resources/reject empty body.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // A 400 here is the contract working: a caller that forgets `text` gets
      // told so, instead of a row of blanks appearing in the sheet.
      pm.test('responds 400', () => pm.response.to.have.status(400));

      pm.test('names the missing field', () => {
        pm.expect(pm.response.json().error).to.include('text');
      });
